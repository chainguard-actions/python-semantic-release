name: Test custom config file input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git identity and a reachable origin for Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Create a bare repo under GITHUB_WORKSPACE (host path) so it maps to
          # /github/workspace/.git-remote inside the Docker container
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          # Set origin to the container-internal path so Docker action can reach it
          git remote set-url origin "/github/workspace/.git-remote" 2>/dev/null || \
            git remote add origin "/github/workspace/.git-remote"

      - name: Set up project files for PSR with custom config
        run: |
          # Copy the custom config to workspace root so it's accessible inside the Docker container
          cp "$GITHUB_WORKSPACE/tests/fixtures/custom-psr-config.toml" "$GITHUB_WORKSPACE/custom-psr-config.toml"
          # Create a minimal pyproject.toml for version tracking (required by custom config's version_toml)
          cat > "$GITHUB_WORKSPACE/pyproject.toml" << 'EOF'
          [build-system]
          requires = ["setuptools"]
          build-backend = "setuptools.build_meta"

          [project]
          name = "test-project"
          version = "0.1.0"
          EOF
          git add pyproject.toml custom-psr-config.toml
          git commit -m "chore: add test config files" || true
          # Push using the host-side path
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          config_file: custom-psr-config.toml
          no_operation_mode: "true"
          push: "false"
          commit: "false"
          tag: "false"
          vcs_release: "false"
          changelog: "false"
          verbosity: "1"

      - name: Assert action ran with custom config
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERSION: ${{ steps.action.outputs.version }}
          RELEASED: ${{ steps.action.outputs.released }}
        run: |
          echo "outcome: $OUTCOME"
          echo "version: $VERSION"
          echo "released: $RELEASED"

          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$VERSION" ]; then
              echo "FAIL: action succeeded but 'version' output is empty"
              exit 1
            fi
            if [ "$RELEASED" != "true" ] && [ "$RELEASED" != "false" ]; then
              echo "FAIL: 'released' output should be 'true' or 'false', got: $RELEASED"
              exit 1
            fi
            echo "PASS: action succeeded with custom config, version=$VERSION released=$RELEASED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or config issue is expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
