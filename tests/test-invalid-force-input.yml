name: Test invalid force input (no exit on bad force value)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git config and local origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

          # Create a version tag so PSR has a baseline
          git tag v1.0.0 HEAD || true

          # Create a bare repo under GITHUB_WORKSPACE so it's reachable inside the Docker container
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          no_operation_mode: "true"
          directory: tests/fixtures/test-project
          force: "invalid-level"
          push: "false"
          tag: "false"
          commit: "false"
          changelog: "false"
          vcs_release: "false"
          build: "false"
          git_committer_name: "Test User"
          git_committer_email: "test@example.com"

      - name: Assert action handled invalid force input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "version: $VERSION"
          # The action.sh prints an error for invalid force but does NOT exit 1 —
          # it continues and runs semantic-release without the --force flag.
          # So the action may succeed (running without force) or fail due to harness
          # constraints (sentinel repo). Both outcomes are acceptable.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran without --force flag (invalid force value was ignored by action.sh)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed (expected in harness due to sentinel repo or other constraint)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
