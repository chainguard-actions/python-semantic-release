[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "test-project"
version = "0.1.0"
description = "Test project for PSR action tests"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
major_on_zero = false
tag_format = "v{version}"

[tool.semantic_release.branches.main]
match = "^(main|master|act-harness)$"
prerelease = false

[tool.semantic_release.remote]
type = "github"
token = { env = "GH_TOKEN" }
