---
name: Test custom git committer settings in noop mode
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git repo with PSR config for committer test
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

          mkdir -p "$GITHUB_WORKSPACE/psr-committer-test"
          cd "$GITHUB_WORKSPACE/psr-committer-test"

          git init
          git config user.email "test@example.com"
          git config user.name "Test User"

          printf '[tool.semantic_release]\nversion_variables = []\ncommit_parser = "angular"\ntag_format = "v{version}"\nmajor_on_zero = false\nallow_zero_version = true\n\n[tool.semantic_release.remote]\ntype = "github"\ntoken = { env = "GH_TOKEN" }\n' > pyproject.toml

          git add pyproject.toml
          git commit -m "chore: initial commit"
          git tag v2.0.0

          # Add a feature commit (minor bump)
          echo "# Feature" > FEATURE.md
          git add FEATURE.md
          git commit -m "feat: add new feature"

          # Set up local bare repo as origin reachable inside Docker container
          rm -rf "$GITHUB_WORKSPACE/.git-remote-psr-committer"
          git init --bare "$GITHUB_WORKSPACE/.git-remote-psr-committer"
          git remote add origin "$GITHUB_WORKSPACE/.git-remote-psr-committer"
          git push origin HEAD:refs/heads/act-harness
          git push origin --tags

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          directory: psr-committer-test
          no_operation_mode: "true"
          git_committer_name: "Release Bot"
          git_committer_email: "bot@example.com"
          commit: "false"
          tag: "false"
          push: "false"
          changelog: "false"
          vcs_release: "false"
          verbosity: "1"

      - name: Assert action ran with custom committer settings
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERSION: ${{ steps.action.outputs.version }}
          RELEASED: ${{ steps.action.outputs.released }}
          PREV_VERSION: ${{ steps.action.outputs.previous_version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "version: $VERSION"
          echo "released: $RELEASED"
          echo "previous_version: $PREV_VERSION"

          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$VERSION" ]; then
              echo "FAIL: action succeeded but version output is empty"
              exit 1
            fi
            echo "PASS: got version '$VERSION' with custom committer settings"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or noop mode limitation)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
