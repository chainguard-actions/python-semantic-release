---
name: Test invalid force input behavior
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git identity, tag, and origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

          # Create a version tag so PSR has a baseline
          git tag v0.1.0 HEAD 2>/dev/null || true

          # Create a bare repo inside GITHUB_WORKSPACE so it's accessible
          # inside the Docker container at /github/workspace/.git-remote
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          no_operation_mode: "true"
          force: "invalid-level"
          commit: "false"
          tag: "false"
          push: "false"
          vcs_release: "false"
          changelog: "false"
          directory: "tests/fixtures"
        continue-on-error: true

      - name: Assert action ran (invalid force is logged but does not abort the action)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "version: $VERSION"
          # The action.sh script logs an error for invalid force but does NOT exit.
          # The action continues without the --force flag.
          # So the action may succeed (version determined without force) or fail
          # for other reasons (e.g. sentinel repo). Either outcome is acceptable.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran with invalid force (error logged, execution continued)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
