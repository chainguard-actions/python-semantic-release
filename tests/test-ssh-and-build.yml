name: Test SSH signing keys and build inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Generate test SSH key pair
        id: keygen
        run: |
          ssh-keygen -t ed25519 -C "test@example.com" -f /tmp/test_signing_key -N ""
          echo "public_key=$(cat /tmp/test_signing_key.pub)" >> "$GITHUB_OUTPUT"
          echo "private_key_b64=$(base64 -w0 /tmp/test_signing_key)" >> "$GITHUB_OUTPUT"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          ssh_public_signing_key: ${{ steps.keygen.outputs.public_key }}
          ssh_private_signing_key: ${{ steps.keygen.outputs.private_key_b64 }}
          build: "false"
          build_metadata: "local.test"
          no_operation_mode: "true"
          push: "false"
          tag: "false"
          commit: "false"
          vcs_release: "false"

      - name: Assert action ran (outputs set, or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERSION: ${{ steps.action.outputs.version }}
          RELEASED: ${{ steps.action.outputs.released }}
        run: |
          echo "outcome: $OUTCOME"
          echo "version: $VERSION"
          echo "released: $RELEASED"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with SSH signing and build inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
