name: Test force patch version bump in noop mode
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git config and local origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

          # Create a version tag so PSR has a baseline
          git tag v1.0.0 HEAD || true

          # Add a fix commit to trigger a patch bump
          git commit -m "fix: a bug fix" --allow-empty

          # Create a bare repo under GITHUB_WORKSPACE so it's reachable inside the Docker container
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          no_operation_mode: "true"
          directory: tests/fixtures/test-project
          force: "patch"
          push: "false"
          tag: "false"
          commit: "false"
          changelog: "false"
          vcs_release: "false"
          build: "false"
          git_committer_name: "Test User"
          git_committer_email: "test@example.com"

      - name: Assert force patch version bump
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERSION: ${{ steps.action.outputs.version }}
          RELEASED: ${{ steps.action.outputs.released }}
          PREVIOUS_VERSION: ${{ steps.action.outputs.previous_version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "version: $VERSION"
          echo "released: $RELEASED"
          echo "previous_version: $PREVIOUS_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$VERSION" ]; then
              echo "FAIL: action succeeded but version output is empty"
              exit 1
            fi
            echo "PASS: force patch ran successfully, version=$VERSION previous=$PREVIOUS_VERSION"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or config issue expected in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
