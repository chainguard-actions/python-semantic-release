---
name: Test noop mode (no-operation)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git repo with conventional commits and PSR config
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

          # Create a minimal pyproject.toml with PSR config in a temp workspace
          mkdir -p "$GITHUB_WORKSPACE/psr-test-workspace"
          cd "$GITHUB_WORKSPACE/psr-test-workspace"

          git init
          git config user.email "test@example.com"
          git config user.name "Test User"

          # Create a minimal pyproject.toml with PSR config using printf
          printf '[tool.semantic_release]\nversion_variables = []\ncommit_parser = "angular"\ntag_format = "v{version}"\nmajor_on_zero = false\nallow_zero_version = true\n\n[tool.semantic_release.remote]\ntype = "github"\ntoken = { env = "GH_TOKEN" }\n' > pyproject.toml

          # Initial commit to establish a base version
          git add pyproject.toml
          git commit -m "chore: initial commit"

          # Tag an initial version
          git tag v0.1.0

          # Add a fix commit (should trigger patch bump)
          echo "# My Project" > README.md
          git add README.md
          git commit -m "fix: add readme"

          # Set up a local bare repo as origin (reachable inside Docker container)
          rm -rf "$GITHUB_WORKSPACE/.git-remote-psr-test"
          git init --bare "$GITHUB_WORKSPACE/.git-remote-psr-test"
          git remote add origin "$GITHUB_WORKSPACE/.git-remote-psr-test"
          git push origin HEAD:refs/heads/act-harness
          git push origin --tags

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          directory: psr-test-workspace
          no_operation_mode: "true"
          commit: "false"
          tag: "false"
          push: "false"
          changelog: "false"
          vcs_release: "false"
          verbosity: "1"

      - name: Assert action ran and produced version output
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERSION: ${{ steps.action.outputs.version }}
          RELEASED: ${{ steps.action.outputs.released }}
          PREV_VERSION: ${{ steps.action.outputs.previous_version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "version: $VERSION"
          echo "released: $RELEASED"
          echo "previous_version: $PREV_VERSION"

          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$VERSION" ]; then
              echo "FAIL: action succeeded but version output is empty"
              exit 1
            fi
            echo "PASS: got version '$VERSION'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or noop mode limitation)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
