name: Test force patch release
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git identity and a reachable origin for Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Create a bare repo under GITHUB_WORKSPACE (host path) so it maps to
          # /github/workspace/.git-remote inside the Docker container
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          # Set origin to the container-internal path so Docker action can reach it
          git remote set-url origin "/github/workspace/.git-remote" 2>/dev/null || \
            git remote add origin "/github/workspace/.git-remote"

      - name: Copy fixture config to workspace root and commit
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/pyproject.toml" "$GITHUB_WORKSPACE/pyproject.toml"
          git add pyproject.toml
          git commit -m "chore: add test pyproject.toml" || true
          # Push using the host-side path
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          no_operation_mode: "true"
          push: "false"
          commit: "false"
          tag: "false"
          vcs_release: "false"
          changelog: "false"
          force: "patch"
          verbosity: "1"

      - name: Assert action ran with force=patch
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERSION: ${{ steps.action.outputs.version }}
          RELEASED: ${{ steps.action.outputs.released }}
        run: |
          echo "outcome: $OUTCOME"
          echo "version: $VERSION"
          echo "released: $RELEASED"

          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$VERSION" ]; then
              echo "FAIL: action succeeded but 'version' output is empty"
              exit 1
            fi
            # With force=patch, released should be true
            if [ "$RELEASED" != "true" ]; then
              echo "WARN: expected released=true with force=patch, got: $RELEASED"
            fi
            echo "PASS: action succeeded with force=patch, version=$VERSION released=$RELEASED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or config issue is expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
