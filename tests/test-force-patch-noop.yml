---
name: Test force patch version with noop mode
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git config and local origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Create a bare repo under GITHUB_WORKSPACE so it's reachable inside the Docker container
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a minimal pyproject.toml for PSR
        run: |
          cat > "$GITHUB_WORKSPACE/pyproject.toml" << 'EOF'
          [tool.semantic_release]
          version_variables = []
          commit_parser = "angular"
          tag_format = "v{version}"
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          no_operation_mode: "true"
          force: "patch"
          push: "false"
          commit: "false"
          tag: "false"
          changelog: "false"
          vcs_release: "false"
          build: "false"
          git_committer_name: "Test User"
          git_committer_email: "test@example.com"
          verbosity: "1"

      - name: Assert action ran with force patch or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERSION: ${{ steps.action.outputs.version }}
          RELEASED: ${{ steps.action.outputs.released }}
          IS_PRERELEASE: ${{ steps.action.outputs.is_prerelease }}
        run: |
          echo "outcome: $OUTCOME"
          echo "version: $VERSION"
          echo "released: $RELEASED"
          echo "is_prerelease: $IS_PRERELEASE"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with force=patch in noop mode"
            # In noop mode with force=patch, is_prerelease should be false
            if [ -n "$IS_PRERELEASE" ] && [ "$IS_PRERELEASE" != "false" ]; then
              echo "FAIL: expected is_prerelease=false for a patch release, got: $IS_PRERELEASE"
              exit 1
            fi
            echo "PASS: is_prerelease is correctly false for patch release"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo or no prior version)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
